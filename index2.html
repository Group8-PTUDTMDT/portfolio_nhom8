
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang cá nhân</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding-bottom: 70px;
            background-color: #f2f7fc;
        }

        h2 {
            color: #245580;
        }

        .kda {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
        }

        .submit {
            background-color: #367bb5;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        .submit:hover {
            background-color: #245580;
        }

        input, textarea {
            width: 400px;
            padding: 8px;
        }

        .fixed-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #245580;
            color: white;
            text-align: center;
            padding: 2px 0;
        }
    </style>
</head>

<body>

    <!-- PHẦN DỰ ÁN -->
    <div class="kda">
        <h2>HTML (Phần 2: Dự án, Form & Footer)</h2>

        <h3>Dự án 1</h3>
        <p>.............</p>
        <a href="https://github.com/">Xem dự án</a>

        <h3>Dự án 2</h3>
        <p>..................</p>
        <a href="https://github.com/">Xem dự án</a>

        <h3>Dự án 3</h3>
        <p>..............................</p>
        <a href="https://github.com/">Xem dự án</a>
    </div>

    <!-- PHẦN FORM LIÊN HỆ -->
    <h2>Liên hệ với tôi</h2>

    <form id="contactForm">
        <label for="fullname">Họ và tên:</label><br>
        <input type="text" id="fullname" name="fullname"
               placeholder="Nhập họ tên"><br><br>

        <label for="email">Email:</label><br>
        <input type="text" id="email" name="email"
               placeholder="Nhập email"><br><br>

        <label for="message">Nội dung tin nhắn bạn muốn gửi:</label><br>
        <textarea id="message" name="message"
                  rows="5" placeholder="Nhập tin nhắn"></textarea><br><br>

        <button type="submit" class="submit">Gửi</button>
    </form>

    <!-- PHẦN FOOTER -->
    <footer class="fixed-footer">
        <p>&copy; 2026 Bản quyền thuộc về tôi.</p>
    </footer>

</body>
</html>
